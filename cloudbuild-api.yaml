substitutions:
  _PROJECT_ID: your-project-id
  _REGION: us-central1
  _REPOSITORY: mlops-repo
  _IMAGE_NAME: api
  _IMAGE_TAG: latest
  _DOCKERFILE: Dockerfile.api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
