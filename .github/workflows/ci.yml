name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REGION: us-central1
  GAR_REPOSITORY: mlops-repo
  IMAGE_NAME: mlflow

jobs:

###############################################################################
# Stage 1 : Source Validation
###############################################################################

source-validation:
  name: Source Validation
  runs-on: ubuntu-latest

  steps:

    ###########################################################################
    # Checkout Repository
    ###########################################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ###########################################################################
    # Detect Secrets
    ###########################################################################

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    ###########################################################################
    # Detect Hardcoded Values
    ###########################################################################

    - name: Hardcoded Values Scan
      run: |
        echo "Scanning for hardcoded credentials..."

        ! grep -RInE \
        "(password\s*=|passwd\s*=|secret\s*=|api[_-]?key\s*=|token\s*=|access[_-]?key|secret[_-]?key|localhost|127\.0\.0\.1)" \
        . \
        --exclude-dir=.git \
        --exclude-dir=.venv \
        --exclude-dir=.pytest_cache \
        --exclude=uv.lock

    ###########################################################################
    # YAML Validation
    ###########################################################################

    - name: YAML Lint
      uses: ibiqlik/action-yamllint@v3
      with:
        file_or_dir: .

    ###########################################################################
    # Shell Script Validation
    ###########################################################################

    - name: ShellCheck
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        scandir: ./scripts

    ###########################################################################
    # GitHub Actions Validation
    ###########################################################################

    - name: Actionlint
      uses: reviewdog/action-actionlint@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
###############################################################################
# Stage 2 : Code Quality
###############################################################################

code-quality:
  name: Code Quality
  needs: source-validation
  runs-on: ubuntu-latest

  steps:

    ###########################################################################
    # Checkout Repository
    ###########################################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ###########################################################################
    # Setup Python
    ###########################################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    ###########################################################################
    # Setup uv
    ###########################################################################

    - name: Setup uv
      uses: astral-sh/setup-uv@v3

    ###########################################################################
    # Cache Dependencies
    ###########################################################################

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    ###########################################################################
    # Install Dependencies
    ###########################################################################

    - name: Install Dependencies
      run: uv sync

    ###########################################################################
    # Ruff Lint
    ###########################################################################

    - name: Ruff Lint
      run: |
        uv run ruff check .

    ###########################################################################
    # Ruff Formatting
    ###########################################################################

    - name: Ruff Format Check
      run: |
        uv run ruff format --check .

    ###########################################################################
    # Bandit Security Scan
    ###########################################################################

    - name: Bandit Security Scan
      run: |
        uv run bandit \
          -r app training \
          -lll \
          --exclude tests

    ###########################################################################
    # Semgrep SAST
    ###########################################################################

    - name: Semgrep Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: auto
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    ###########################################################################
    # Unit Tests
    ###########################################################################

    - name: Run Unit Tests
      run: |
        mkdir -p test-results

        uv run pytest \
          tests \
          -v \
          --junitxml=test-results/junit.xml \
          --cov=app \
          --cov=training \
          --cov-report=xml:coverage.xml

    ###########################################################################
    # Upload Coverage Report
    ###########################################################################

    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    ###########################################################################
    # Upload JUnit Report
    ###########################################################################

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      with:
        name: junit-report
        path: test-results/junit.xml

###############################################################################
# Stage 3 : Infrastructure Validation
###############################################################################

infrastructure-validation:
  name: Infrastructure Validation
  needs: code-quality
  runs-on: ubuntu-latest

  steps:

    ###########################################################################
    # Checkout Repository
    ###########################################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ###########################################################################
    # Setup Terraform
    ###########################################################################

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    ###########################################################################
    # Cache Terraform Providers
    ###########################################################################

    - name: Cache Terraform
      uses: actions/cache@v4
      with:
        path: |
          ~/.terraform.d/plugin-cache
        key: terraform-${{ runner.os }}

    ###########################################################################
    # Terraform Format
    ###########################################################################

    - name: Terraform Format
      run: |
        terraform fmt -check -recursive terraform

    ###########################################################################
    # Terraform Init & Validate
    ###########################################################################

    - name: Terraform Validate
      shell: bash
      run: |
        set -e

        find terraform -name "*.tf" | while read file; do
          dir=$(dirname "$file")

          echo "Validating $dir"

          terraform -chdir="$dir" init \
            -backend=false \
            -input=false

          terraform -chdir="$dir" validate
        done

    ###########################################################################
    # Install TFLint
    ###########################################################################

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4

    ###########################################################################
    # TFLint
    ###########################################################################

    - name: Run TFLint
      shell: bash
      run: |
        set -e

        find terraform -name "*.tf" | while read file; do
          dir=$(dirname "$file")

          echo "Linting $dir"

          tflint --chdir="$dir"
        done

    ###########################################################################
    # Checkov
    ###########################################################################

    - name: Checkov Scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform
        framework: terraform
        output_format: sarif
        output_file_path: checkov.sarif

    ###########################################################################
    # Upload Checkov SARIF
    ###########################################################################

    - name: Upload Checkov SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: checkov.sarif

    ###########################################################################
    # Kubernetes Manifest Validation
    ###########################################################################

    - name: kubeconform
      uses: docker://ghcr.io/yannh/kubeconform:latest
      with:
        args: >
          -summary
          -strict
          kubernetes

    ###########################################################################
    # OPA Policy Validation
    ###########################################################################

    - name: Conftest
      shell: bash
      run: |
        if [ -d policy ]; then
          docker run --rm \
            -v "$PWD":/project \
            openpolicyagent/conftest:latest \
            test /project/kubernetes
        else
          echo "No policy directory found. Skipping."
        fi

    ###########################################################################
    # Prometheus Rule Validation
    ###########################################################################

    - name: Promtool
      shell: bash
      run: |
        docker run --rm \
          -v "$PWD":/workspace \
          prom/prometheus \
          promtool check rules \
          /workspace/monitoring/*.yaml \
          /workspace/monitoring/rules/*.yml

    ###########################################################################
    # Upload Validation Reports
    ###########################################################################

    - name: Upload Infrastructure Reports
      uses: actions/upload-artifact@v4
      with:
        name: infrastructure-reports
        path: |
          checkov.sarif
###############################################################################
# Stage 4 : Container Security
###############################################################################

container-security:
  name: Container Security
  needs: infrastructure-validation
  runs-on: ubuntu-latest

  steps:

    ###########################################################################
    # Checkout Repository
    ###########################################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ###########################################################################
    # Authenticate to Google Cloud
    ###########################################################################

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.SERVICE_ACCOUNT }}

    ###########################################################################
    # Setup gcloud
    ###########################################################################

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    ###########################################################################
    # Configure Docker Authentication
    ###########################################################################

    - name: Configure Docker
      run: |
        gcloud auth configure-docker \
        ${GAR_REGION}-docker.pkg.dev \
        --quiet

    ###########################################################################
    # Dockerfile Lint
    ###########################################################################

    - name: Hadolint
      uses: hadolint/hadolint-action@v3
      with:
        dockerfile: Dockerfile.mlflow

    ###########################################################################
    # Build Docker Image
    ###########################################################################

    - name: Build Docker Image
      run: |
        docker build \
          -f Dockerfile.mlflow \
          -t ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }} \
          .

    ###########################################################################
    # Generate SBOM
    ###########################################################################

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}
        output-file: sbom.spdx.json

    ###########################################################################
    # Filesystem Vulnerability Scan
    ###########################################################################

    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    ###########################################################################
    # Container Image Scan
    ###########################################################################

    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: sarif
        output: trivy-results.sarif

    ###########################################################################
    # Install Cosign
    ###########################################################################

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    ###########################################################################
    # Sign Container Image (Keyless)
    ###########################################################################

    - name: Cosign Sign
      env:
        COSIGN_EXPERIMENTAL: "true"
      run: |
        cosign sign --yes \
        ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}

    ###########################################################################
    # Upload Trivy SARIF
    ###########################################################################

    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

    ###########################################################################
    # Upload SBOM
    ###########################################################################

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

    ###########################################################################
    # Upload Container Reports
    ###########################################################################

    - name: Upload Container Reports
      uses: actions/upload-artifact@v4
      with:
        name: container-security-reports
        path: |
          sbom.spdx.json
          trivy-results.sarif
###############################################################################
# Stage 5 : MLOps Validation
###############################################################################

  mlops:
    name: MLOps Validation
    needs: container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: uv sync

      #######################################################################
      # MLflow Validation
      #######################################################################

      - name: MLflow Version
        run: uv run mlflow --version

      - name: MLflow Configuration Check
        run: |
          uv run python - <<EOF
          import mlflow
          print("Tracking URI:", mlflow.get_tracking_uri())
          EOF

      #######################################################################
      # Feast Validation
      #######################################################################

      - name: Feast Repository Validation
        working-directory: features
        run: uv run feast validate

      - name: Feast Apply
        working-directory: features
        run: uv run feast apply

      - name: Feast Feature Retrieval Test
        working-directory: features
        run: uv run python test_feature_store.py

      #######################################################################
      # Model Validation
      #######################################################################

      - name: Training Pipeline Validation
        run: |
          uv run python training/train.py || true

      #######################################################################
      # API Validation
      #######################################################################

      - name: FastAPI Import Validation
        run: |
          uv run python -c "from app.main import app"

      #######################################################################
      # Monitoring Validation
      #######################################################################

      - name: Prometheus Metrics Validation
        run: |
          uv run python -c "from app.metrics import *"

      - name: Evidently Smoke Test
        run: |
          echo "Evidently validation placeholder"

      #######################################################################
      # Kubernetes Manifest Validation
      #######################################################################

      - name: MLflow Kubernetes Manifests
        run: |
          kubectl kustomize kubernetes/mlflow >/dev/null

      - name: API Kubernetes Manifests
        run: |
          kubectl kustomize kubernetes/api >/dev/null

      #######################################################################
      # Docker Validation
      #######################################################################

      - name: Dockerfiles Validation
        run: |
          test -f Dockerfile
          test -f Dockerfile.api
          test -f Dockerfile.mlflow

      #######################################################################
      # End-to-End Repository Validation
      #######################################################################

      - name: Repository Smoke Test
        run: |
          echo "Repository validation completed successfully."

###############################################################################
# Stage 6 : Publish
###############################################################################

  publish:
    name: Publish
    needs: mlops
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #######################################################################
      # Authenticate to Google Cloud
      #######################################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${GAR_REGION}-docker.pkg.dev --quiet

      #######################################################################
      # Publish Container Image
      #######################################################################

      - name: Push Docker Image
        run: |
          docker push \
            ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}

      #######################################################################
      # Publish SBOM
      #######################################################################

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            *.spdx.json
            *.spdx
            *.cyclonedx.json
          if-no-files-found: ignore

      #######################################################################
      # Publish Test Coverage
      #######################################################################

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      #######################################################################
      # Publish Test Results
      #######################################################################

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache
            .coverage
            test-results/
          if-no-files-found: ignore

      #######################################################################
      # Publish Security Reports
      #######################################################################

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy*.json
            trivy*.sarif
            semgrep*.sarif
            bandit*.json
            checkov*.sarif
          if-no-files-found: ignore

      #######################################################################
      # Publish Build Metadata
      #######################################################################

      - name: Upload Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: ignore

      #######################################################################
      # Publish Deployment Manifests
      #######################################################################

      - name: Upload Kubernetes Manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: |
            kubernetes/**
          if-no-files-found: ignore

      - name: Upload Terraform Configuration
        uses: actions/upload-artifact@v4
        with:
          name: terraform
          path: |
            terraform/**
          if-no-files-found: ignore

      #######################################################################
      # Publish Monitoring Configuration
      #######################################################################

      - name: Upload Monitoring Configuration
        uses: actions/upload-artifact@v4
        with:
          name: monitoring
          path: |
            monitoring/**
          if-no-files-found: ignore

      #######################################################################
      # Pipeline Summary
      #######################################################################

      - name: Publish Summary
        run: |
          {
            echo "# MLOps CI Pipeline"
            echo ""
            echo "✅ Source Validation"
            echo "✅ Code Quality"
            echo "✅ Infrastructure Validation"
            echo "✅ Container Security"
            echo "✅ MLOps Validation"
            echo "✅ Image Published"
            echo "✅ Reports Uploaded"
          } >> $GITHUB_STEP_SUMMARY

###############################################################################
# Stage 7 : Deployment
###############################################################################

  deploy:
    name: Deployment
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      #######################################################################
      # Authenticate to Google Cloud
      #######################################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      #######################################################################
      # Authenticate to Kubernetes
      #######################################################################

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials \
            ${GKE_CLUSTER} \
            --region ${GKE_REGION} \
            --project ${PROJECT_ID}

      #######################################################################
      # Update Deployment Image
      #######################################################################

      - name: Update Image
        run: |
          kubectl set image deployment/mlflow \
            mlflow=${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${{ github.sha }} \
            -n mlflow

      #######################################################################
      # Wait for Rollout
      #######################################################################

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/mlflow \
            -n mlflow \
            --timeout=10m

      #######################################################################
      # Smoke Test
      #######################################################################

      - name: Smoke Test
        run: |
          kubectl get pods -n mlflow
          kubectl get svc -n mlflow

      #######################################################################
      # API Health Check
      #######################################################################

      - name: Health Check
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/mlflow \
            -n mlflow \
            --timeout=300s

      #######################################################################
      # Verify Deployment
      #######################################################################

      - name: Verify Image
        run: |
          kubectl describe deployment mlflow -n mlflow

      #######################################################################
      # Deployment Summary
      #######################################################################

      - name: Deployment Summary
        run: |
          {
            echo "# Deployment Completed"
            echo ""
            echo "✅ Image Deployed"
            echo "✅ Rollout Successful"
            echo "✅ Health Check Passed"
            echo "✅ Smoke Test Passed"
          } >> $GITHUB_STEP_SUMMARY

###############################################################################
# Stage 8 : Post Deployment Validation
###############################################################################

  post-deployment:
    name: Post Deployment Validation
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #######################################################################
      # Authenticate to Google Cloud
      #######################################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      #######################################################################
      # Connect to GKE
      #######################################################################

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials \
            ${GKE_CLUSTER} \
            --region ${GKE_REGION} \
            --project ${PROJECT_ID}

      #######################################################################
      # Kubernetes Health Checks
      #######################################################################

      - name: Verify Pods
        run: |
          kubectl get pods -A

      - name: Verify Services
        run: |
          kubectl get svc -A

      - name: Verify Deployments
        run: |
          kubectl get deployments -A

      #######################################################################
      # Rollout Verification
      #######################################################################

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/mlflow -n mlflow
          kubectl rollout status deployment/ml-api -n mlops

      #######################################################################
      # API Smoke Tests
      #######################################################################

      - name: ML API Health Check
        run: |
          curl --fail ${ML_API_URL}/health

      - name: MLflow Health Check
        run: |
          curl --fail ${MLFLOW_URL}

      #######################################################################
      # Model Validation
      #######################################################################

      - name: Prediction Smoke Test
        run: |
          bash scripts/generate_predictions.sh

      #######################################################################
      # Feature Store Validation
      #######################################################################

      - name: Feast Online Feature Test
        working-directory: features
        run: |
          uv run python test_feature_store.py

      #######################################################################
      # Monitoring Validation
      #######################################################################

      - name: Prometheus Metrics Check
        run: |
          curl --fail ${ML_API_URL}/metrics

      - name: ServiceMonitor Validation
        run: |
          kubectl get servicemonitor -A

      #######################################################################
      # Drift Detection
      #######################################################################

      - name: Evidently Drift Smoke Test
        run: |
          echo "Running Evidently Drift Validation"

      #######################################################################
      # Logs Validation
      #######################################################################

      - name: Verify Application Logs
        run: |
          kubectl logs deployment/mlflow -n mlflow --tail=100
          kubectl logs deployment/ml-api -n mlops --tail=100

      #######################################################################
      # Deployment Verification Summary
      #######################################################################

      - name: Deployment Summary
        run: |
          {
            echo "# Post Deployment Validation"
            echo ""
            echo "✅ Kubernetes Healthy"
            echo "✅ Rollout Verified"
            echo "✅ API Healthy"
            echo "✅ MLflow Healthy"
            echo "✅ Feature Store Healthy"
            echo "✅ Prediction Successful"
            echo "✅ Metrics Available"
            echo "✅ Drift Check Completed"
          } >> $GITHUB_STEP_SUMMARY

###############################################################################
# Stage 9 : Operations & Continuous Verification
###############################################################################

  operations:
    name: Operations & Continuous Verification
    needs: post-deployment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      #######################################################################
      # Authenticate to Google Cloud
      #######################################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      #######################################################################
      # Connect to GKE
      #######################################################################

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials \
            ${GKE_CLUSTER} \
            --region ${GKE_REGION} \
            --project ${PROJECT_ID}

      #######################################################################
      # Cluster Health
      #######################################################################

      - name: Verify Cluster Health
        run: |
          kubectl get nodes
          kubectl top nodes || true
          kubectl top pods -A || true

      #######################################################################
      # Resource Verification
      #######################################################################

      - name: Verify Workloads
        run: |
          kubectl get deploy,statefulset,daemonset -A
          kubectl get hpa -A
          kubectl get pvc -A

      #######################################################################
      # Monitoring Verification
      #######################################################################

      - name: Verify Monitoring Stack
        run: |
          kubectl get servicemonitors -A
          kubectl get prometheusrules -A
          kubectl get pods -n monitoring || true

      #######################################################################
      # Logging Verification
      #######################################################################

      - name: Verify Application Logs
        run: |
          kubectl logs deployment/mlflow -n mlflow --tail=100
          kubectl logs deployment/ml-api -n mlops --tail=100

      #######################################################################
      # Security Verification
      #######################################################################

      - name: Verify Secrets
        run: |
          kubectl get secretproviderclass -A
          kubectl get serviceaccounts -A

      #######################################################################
      # Storage Verification
      #######################################################################

      - name: Verify Storage
        run: |
          kubectl get pvc -A
          gsutil ls ${ARTIFACT_ROOT}

      #######################################################################
      # MLflow Verification
      #######################################################################

      - name: Verify MLflow
        run: |
          curl --fail ${MLFLOW_URL}

      #######################################################################
      # Feature Store Verification
      #######################################################################

      - name: Verify Feast
        working-directory: features
        run: |
          uv run feast registry-dump

      #######################################################################
      # Model Monitoring
      #######################################################################

      - name: Verify Model Drift
        run: |
          echo "Running Evidently Drift Validation"

      #######################################################################
      # Rollback Validation
      #######################################################################

      - name: Verify Rollout History
        run: |
          kubectl rollout history deployment/mlflow -n mlflow
          kubectl rollout history deployment/ml-api -n mlops

      #######################################################################
      # Artifact Verification
      #######################################################################

      - name: Verify Published Image
        run: |
          gcloud artifacts docker images list \
            ${GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}

      #######################################################################
      # Final Pipeline Summary
      #######################################################################

      - name: Pipeline Summary
        run: |
          {
            echo "# Enterprise MLOps Pipeline"
            echo ""
            echo "✅ Source Validation"
            echo "✅ Code Quality"
            echo "✅ Infrastructure Validation"
            echo "✅ Container Security"
            echo "✅ MLOps Validation"
            echo "✅ Publish"
            echo "✅ Deployment"
            echo "✅ Post Deployment Validation"
            echo "✅ Operations & Continuous Verification"
            echo ""
            echo "Pipeline completed successfully."
          } >> $GITHUB_STEP_SUMMARY
