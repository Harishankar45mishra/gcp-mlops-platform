[project]
name = "gcp-mlops-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "mlflow>=3.16.0",
    "pandas>=2.3.2",
    "numpy>=2.3.3",
    "scikit-learn>=1.7.2",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "prometheus-client>=0.23.1",
    "google-cloud-storage>=3.4.1",
    "google-cloud-secret-manager>=2.24.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "structlog>=26.1.0",
    "evidently>=0.7.23",
    "shap>=0.52.0",
    "feast>=0.66.0",
    "pyarrow>=25.0.1",
]
[project.scripts]
gcp-mlops-platform = "gcp_mlops_platform:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
