[project]
name = "gcp-mlops-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.14.1",
    "joblib>=1.6.0",
    "mlflow>=3.16.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
gcp-mlops-platform = "gcp_mlops_platform:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
